# One-click desktop release.
# Validates changelog → builds macOS / Windows / Linux installers →
# publishes assets + notes to Origin-Technology-Co-Ltd/chat-plus Releases →
# tags the repository where this workflow runs (private or public).
#
# Synced to the public repo (except sync-public.yml). On public chat-plus,
# uses GITHUB_TOKEN. On the private repo, uses PUBLIC_REPO_TOKEN to write
# the public Releases.
#
# Sync to public repo only mirrors source/docs/workflows — it does not build installers.

name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver with or without v prefix (e.g. 0.1.0 or v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize version and validate changelog
        id: meta
        env:
          VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          RAW="${VERSION_RAW}"
          RAW="$(echo "$RAW" | tr -d '[:space:]')"
          if [ -z "$RAW" ]; then
            echo "::error::version input is empty"
            exit 1
          fi
          VERSION="${RAW#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '${RAW}'. Use semver like 0.1.0"
            exit 1
          fi
          TAG="v${VERSION}"

          node scripts/extract-changelog-section.mjs "$VERSION" CHANGELOG.md >/dev/null

          CONF_VERSION="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
          if [ "$CONF_VERSION" != "$VERSION" ]; then
            echo "::error::src-tauri/tauri.conf.json version is '${CONF_VERSION}', expected '${VERSION}'. Bump it before releasing."
            exit 1
          fi

          # For tag push events the tag already exists by definition; only enforce
          # "tag must not exist" for manual workflow_dispatch.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
              echo "::error::Tag ${TAG} already exists on origin. Bump the version or delete the old tag first."
              exit 1
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Validated ${TAG}"

  build:
    name: ${{ matrix.os_name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os_name: macos-arm64
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - runner: windows-latest
            os_name: windows-x64
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*setup*.exe
          - runner: ubuntu-22.04
            os_name: linux-x64
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri v2 / WebKitGTK 4.1)
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop packages
        run: pnpm tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: chatplus-${{ matrix.os_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish public Release + private tag
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract notes and stage stable asset names
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/changelog-section.md"
          BODY_FILE="${RUNNER_TEMP}/release-body.md"
          ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$ASSET_DIR"

          node scripts/extract-changelog-section.mjs "$VERSION" CHANGELOG.md > "$NOTES_FILE"

          {
            echo "Desktop installers for ChatPlus \`${TAG}\`."
            echo
            echo "Stable downloads:"
            echo
            echo "- [macOS Apple Silicon (dmg)](https://github.com/Origin-Technology-Co-Ltd/chat-plus/releases/download/${TAG}/ChatPlus-macos-aarch64.dmg)"
            echo "- [Windows x64 setup (exe)](https://github.com/Origin-Technology-Co-Ltd/chat-plus/releases/download/${TAG}/ChatPlus-windows-x64-setup.exe)"
            echo "- [Linux x64 (AppImage)](https://github.com/Origin-Technology-Co-Ltd/chat-plus/releases/download/${TAG}/ChatPlus-linux-x64.AppImage)"
            echo
            echo "---"
            echo
            cat "$NOTES_FILE"
          } > "$BODY_FILE"

          find_one() {
            local pattern="$1"
            local label="$2"
            local found
            found="$(find artifacts -type f -name "$pattern" | head -n 1 || true)"
            if [ -z "$found" ]; then
              echo "::error::Missing ${label} (pattern: ${pattern})"
              exit 1
            fi
            printf '%s\n' "$found"
          }

          cp "$(find_one '*.dmg' 'macOS dmg')" \
            "$ASSET_DIR/ChatPlus-macos-aarch64.dmg"
          cp "$(find_one '*setup*.exe' 'Windows NSIS setup exe')" \
            "$ASSET_DIR/ChatPlus-windows-x64-setup.exe"
          cp "$(find_one '*.AppImage' 'Linux AppImage')" \
            "$ASSET_DIR/ChatPlus-linux-x64.AppImage"

          MSI="$(find artifacts -type f -name '*.msi' | head -n 1 || true)"
          if [ -n "${MSI}" ]; then
            cp "$MSI" "$ASSET_DIR/ChatPlus-windows-x64.msi"
          else
            echo "::warning::Windows .msi not found; continuing with setup.exe only"
          fi

          DEB="$(find artifacts -type f -name '*.deb' | head -n 1 || true)"
          if [ -n "${DEB}" ]; then
            cp "$DEB" "$ASSET_DIR/ChatPlus-linux-x64.deb"
          else
            echo "::warning::Linux .deb not found; continuing with AppImage only"
          fi

          echo "BODY_FILE=${BODY_FILE}" >> "$GITHUB_ENV"
          echo "ASSET_DIR=${ASSET_DIR}" >> "$GITHUB_ENV"
          echo "Staged assets:"
          ls -la "$ASSET_DIR"

      - name: Create or update Release with installers
        env:
          # Private repo: PUBLIC_REPO_TOKEN writes to public chat-plus.
          # Public repo: GITHUB_TOKEN publishes Releases on this same repository.
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: Origin-Technology-Co-Ltd/chat-plus
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing token. On the private repo set PUBLIC_REPO_TOKEN (Contents write on ${RELEASE_REPO}). On the public repo, GITHUB_TOKEN is used automatically. See docs/PUBLISH.md"
            exit 1
          fi

          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG} on ${RELEASE_REPO}"
            gh release edit "$TAG" --repo "$RELEASE_REPO" --notes-file "$BODY_FILE"
            gh release upload "$TAG" "$ASSET_DIR"/* --repo "$RELEASE_REPO" --clobber
          else
            echo "Creating release ${TAG} on ${RELEASE_REPO}"
            gh release create "$TAG" "$ASSET_DIR"/* \
              --repo "$RELEASE_REPO" \
              --title "ChatPlus ${TAG}" \
              --notes-file "$BODY_FILE" \
              --target main
          fi

          echo "Release: https://github.com/${RELEASE_REPO}/releases/tag/${TAG}"

      - name: Tag this repository
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Remote tag ${TAG} already exists on this repo; skipping push"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Local tag ${TAG} already exists; pushing"
          else
            git tag -a "$TAG" -m "Release ${TAG}"
          fi
          git push origin "$TAG"
          echo "Tag ${TAG} pushed to this repository."
