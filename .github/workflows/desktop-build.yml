# Smoke / debug only: build desktop installers as workflow artifacts.
# Does NOT publish to public Releases.
#
# For a real release (mac/win/linux installers + changelog on public GitHub Releases),
# use Actions → "Publish desktop release" (private or public repo after Sync).
# Sync mirrors src-tauri + public workflows; it never builds installers by itself.

name: Desktop build (artifacts only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-artifacts
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os_name: macos-arm64
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - runner: windows-latest
            os_name: windows-x64
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*setup*.exe
          - runner: ubuntu-22.04
            os_name: linux-x64
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri v2 / WebKitGTK 4.1)
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop packages
        run: pnpm tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: chatplus-${{ matrix.os_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
